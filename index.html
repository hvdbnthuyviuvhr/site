<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Био Альберта</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #1a1a2e, #0f3460, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: #ff4b2b;
      filter: blur(200px);
      opacity: 0.4;
      animation: move 8s infinite alternate;
    }

    @keyframes move {
      from { transform: translate(-100px, -100px); }
      to { transform: translate(100px, 100px); }
    }

    .container {
      position: relative;
      z-index: 2;
      backdrop-filter: blur(20px);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px;
      width: 360px;
      text-align: center;
      box-shadow: 0 0 40px rgba(0,0,0,0.6);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin-bottom: 25px;
      font-size: 30px;
    }

    .link {
      display: block;
      text-decoration: none;
      margin: 15px 0;
      padding: 15px;
      border-radius: 14px;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      transition: 0.25s;
    }

    .link:hover {
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(255,75,43,0.8);
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.6;
    }

  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="container">
    <h1>Био Альберта</h1>

    <a class="link" href="https://funpay.com/users/9225164/" target="_blank">
      🔗 Ссылка на мой профиль Фанпей
    </a>

    <a class="link" href="https://t.me/duxov_txa777" target="_blank">
      📩 Мой телеграмм юзернейм
    </a>

    <div class="footer">powered by vibe 😎</div>
  </div>

</body>
</html>
